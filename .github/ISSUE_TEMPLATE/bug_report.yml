name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us investigate and fix the issue.
        
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run command '...'
        2. With parameters '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DNS Master Audit Version
      description: Which version are you using?
      placeholder: "e.g., 3.2.0"
    validations:
      required: true

  - type: dropdown
    id: powershell-version
    attributes:
      label: PowerShell Version
      description: Which PowerShell version are you using?
      options:
        - PowerShell 5.1
        - PowerShell 7.0
        - PowerShell 7.1
        - PowerShell 7.2
        - PowerShell 7.3
        - PowerShell 7.4+
        - Other (please specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running on?
      options:
        - Windows Server 2016
        - Windows Server 2019
        - Windows Server 2022
        - Windows Server 2025
        - Windows 10
        - Windows 11
        - Other (please specify in additional context)
    validations:
      required: true

  - type: input
    id: environment-size
    attributes:
      label: Environment Size
      description: Number of domain controllers
      placeholder: "e.g., 10 DCs"

  - type: textarea
    id: error-message
    attributes:
      label: Error Message
      description: Full error message if applicable (redact sensitive information)
      placeholder: Paste error message here...
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Any relevant log output (redact sensitive information)
      placeholder: Paste log output here...
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Add any other context about the problem here...

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have redacted any sensitive information from logs and error messages
          required: true
        - label: I am using a supported version (2.0+)
          required: true
