name: PowerShell CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and Test on ${{ matrix.os }} - PowerShell ${{ matrix.pwsh-version }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        pwsh-version: ['5.1', '7.4']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup PowerShell 7.x
        if: matrix.pwsh-version == '7.4'
        uses: actions/setup-powershell@v1
        with:
          pwsh-version: '7.4.x'
      
      - name: Display PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
      
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Installing PSScriptAnalyzer..."
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          Get-Module -Name PSScriptAnalyzer -ListAvailable
      
      - name: Install Pester
        shell: pwsh
        run: |
          Write-Host "Installing Pester..."
          Install-Module -Name Pester -Force -Scope CurrentUser -Repository PSGallery -MinimumVersion 5.0
          Get-Module -Name Pester -ListAvailable
      
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Running PSScriptAnalyzer..."
          $results = Invoke-ScriptAnalyzer -Path .\DNS-MasterAudit.ps1 -Settings .\PSScriptAnalyzerSettings.psd1 -Recurse
          
          if ($results) {
            $results | Format-Table -AutoSize
            
            # Fail on Error severity
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) {
              Write-Error "Found $($errors.Count) error(s) from PSScriptAnalyzer"
              exit 1
            }
            
            # Warn on Warning severity
            $warnings = $results | Where-Object { $_.Severity -eq 'Warning' }
            if ($warnings) {
              Write-Warning "Found $($warnings.Count) warning(s) from PSScriptAnalyzer"
            }
          } else {
            Write-Host "✅ No issues found by PSScriptAnalyzer"
          }
      
      - name: Run Pester Tests
        shell: pwsh
        run: |
          Write-Host "Running Pester tests..."
          
          $config = New-PesterConfiguration
          $config.Run.Path = '.\Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.CodeCoverage.Enabled = $false
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          
          Invoke-Pester -Configuration $config
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.pwsh-version }}
          path: testResults.xml
      
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          files: testResults.xml
          check_name: Test Results (${{ matrix.os }} - PowerShell ${{ matrix.pwsh-version }})

  validate-syntax:
    name: Validate PowerShell Syntax
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Validate all PowerShell files
        shell: pwsh
        run: |
          Write-Host "Validating PowerShell syntax..."
          
          $files = Get-ChildItem -Path . -Filter '*.ps1' -Recurse | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          $failed = $false
          
          foreach ($file in $files) {
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $file.FullName -Raw), [ref]$null)
              Write-Host "✅ $($file.Name) - Syntax OK"
            } catch {
              Write-Error "❌ $($file.Name) - Syntax Error: $_"
              $failed = $true
            }
          }
          
          if ($failed) {
            exit 1
          }

